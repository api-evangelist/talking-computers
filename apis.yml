aid: talking-computers
name: Talking Computers
description: >-
  Talking Computers is a Y Combinator (Winter 2026) startup building Facility,
  described as "The Workplace for AI" and delivering autonomous organizations for
  enterprises. The company deploys fleets of AI Infrastructure Engineers that
  collaborate over week-long time horizons, run hundreds of experiments in
  parallel, and learn from them to optimize customers' training and inference
  infrastructure to their specific workloads. Talking Computers reports partnering
  with companies to speed up GPU kernels to 6x state-of-the-art and to cut the
  latency of voice models to roughly half that of competitors. As of enrichment,
  the company is an early-stage two-person team and publishes only a marketing
  presence at talkingcomputers.ai (a single-page application); it exposes no public
  API, OpenAPI definition, developer portal, documentation, or SDKs. This profile
  was surfaced as a Y Combinator portfolio lead and enriched from verified public
  sources.
